[package]
name = "politika-infantry-authoring"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
glam = "0.30"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

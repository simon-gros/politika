name: POLITIKA version contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: versioning-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/version/Cargo.toml -- --check
      - name: Run Rust version-contract tests
        run: cargo test --manifest-path tools/version/Cargo.toml --all-targets
      - name: Validate canonical version and Git tag
        run: cargo run --quiet --manifest-path tools/version/Cargo.toml -- check
      - name: Verify deterministic generated header
        run: |
          cargo run --quiet --manifest-path tools/version/Cargo.toml -- generate --output "$RUNNER_TEMP/PolitikaVersion.generated.h"
          cp "$RUNNER_TEMP/PolitikaVersion.generated.h" "$RUNNER_TEMP/version-first.h"
          cargo run --quiet --manifest-path tools/version/Cargo.toml -- generate --output "$RUNNER_TEMP/PolitikaVersion.generated.h"
          cmp "$RUNNER_TEMP/version-first.h" "$RUNNER_TEMP/PolitikaVersion.generated.h"
      - name: Require clean matching checkout for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo run --quiet --manifest-path tools/version/Cargo.toml -- check --release
